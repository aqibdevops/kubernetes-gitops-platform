apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform-demo, namespace: argocd}
spec:
  project: platform
  source:
    repoURL: https://github.com/example/kubernetes-gitops-platform.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
