name: gitops-validation
on: [pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize overlays/dev > rendered-dev.yaml
      - run: kubectl kustomize overlays/prod > rendered-prod.yaml
      - run: helm version
      - uses: bridgecrewio/checkov-action@v12
        with: {directory: .}
