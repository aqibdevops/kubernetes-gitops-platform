apiVersion: apps/v1
kind: Deployment
metadata: {name: platform-target}
spec:
  replicas: 2
  selector: {matchLabels: {app: platform-target}}
  template:
    metadata: {labels: {app: platform-target}}
    spec:
      containers:
        - name: target
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
